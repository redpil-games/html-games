<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>חשבון + תמונה = כיף</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #cfd8dc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      position: relative;
      width: 100vw;
      max-width: 520px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px 20px 16px;
      background-color: #fff8d6;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      border: 4px solid #ffffff;
      overflow-y: auto;
    }

    #app::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900"><g font-family="sans-serif" font-weight="bold" font-size="28" text-anchor="middle" dominant-baseline="central"><rect x="25" y="15" width="55" height="55" rx="10" fill="%23ff5252" transform="rotate(-8 52 42)"/><text x="52" y="42" fill="white" transform="rotate(-8 52 42)">8</text><rect x="135" y="10" width="55" height="55" rx="10" fill="%23448aff" transform="rotate(6 162 37)"/><text x="162" y="37" fill="white" transform="rotate(6 162 37)">5</text><rect x="250" y="12" width="55" height="55" rx="10" fill="%23ffd740" transform="rotate(-12 277 39)"/><text x="277" y="39" fill="%23d84315" transform="rotate(-12 277 39)">-</text><rect x="355" y="10" width="55" height="55" rx="10" fill="%2369f0ae" transform="rotate(10 382 37)"/><text x="382" y="37" fill="%231b5e20" transform="rotate(10 382 37)">2</text><rect x="440" y="20" width="55" height="55" rx="10" fill="%23ffab40" transform="rotate(-15 467 47)"/><text x="467" y="47" fill="%233e2723" transform="rotate(-15 467 47)">=</text><rect x="10" y="160" width="55" height="55" rx="10" fill="%23ff4081" transform="rotate(15 37 187)"/><text x="37" y="187" fill="white" transform="rotate(15 37 187)">6</text><rect x="455" y="180" width="55" height="55" rx="10" fill="%23ff6e40" transform="rotate(-18 482 207)"/><text x="482" y="207" fill="white" transform="rotate(-18 482 207)">2</text><rect x="8" y="390" width="55" height="55" rx="10" fill="%23ffd740" transform="rotate(-10 35 417)"/><text x="35" y="417" fill="%23b71c1c" transform="rotate(-10 35 417)">1</text><rect x="455" y="410" width="55" height="55" rx="10" fill="%23ff4081" transform="rotate(12 482 437)"/><text x="482" y="437" fill="white" transform="rotate(12 482 437)">0</text><rect x="12" y="620" width="55" height="55" rx="10" fill="%2369f0ae" transform="rotate(18 39 647)"/><text x="39" y="647" fill="%231b5e20" transform="rotate(18 39 647)">2</text><rect x="452" y="610" width="55" height="55" rx="10" fill="%23ffab40" transform="rotate(-8 479 637)"/><text x="479" y="637" fill="%233e2723" transform="rotate(-8 479 637)">1</text></g></svg>');
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    @media (max-width: 540px) {
      #app {
        border-radius: 0;
        border: none;
      }
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 10;
    }

    .mute-btn {
      background: #ffffff;
      border: 2px solid #0288d1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .top-section, .middle-section, .bottom-section {
      position: relative;
      z-index: 1;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 8px;
      margin-top: 16px;
    }

    .progress-wrapper {
      width: 100%;
      max-width: 260px;
      height: 12px;
      background-color: #ffffff;
      border: 3px solid #0288d1;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 0 5px #fff8d6, 0 2px 6px rgba(2, 136, 209, 0.15);
      position: relative;
      z-index: 2;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #81d4fa;
      border-radius: 6px;
      transition: width 0.4s ease-in-out;
    }

    .image-container {
      position: relative;
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      border: 4px solid #0288d1;
      border-radius: 16px;
      background-color: #ffffff;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(2, 136, 209, 0.2);
    }

    #gameImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      background-color: transparent;
      z-index: 2;
    }

    .tile {
      background-color: #81d4fa;
      border: 1px solid #0288d1;
      box-sizing: border-box;
      transition: opacity 0.4s ease;
    }

    .tile.revealed {
      opacity: 0;
      pointer-events: none;
    }

    .name-box {
      width: 100%;
      max-width: 250px;
      padding: 4px 10px;
      border: 3px solid #2e7d32;
      border-radius: 12px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      background-color: #ffffff;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2e7d32;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.15);
      direction: rtl;
      unicode-bidi: isolate;
    }

    .divider {
      width: 85%;
      height: 3px;
      background-color: #ffe082;
      border-radius: 2px;
      margin: 4px 0;
    }

    .middle-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      transition: opacity 0.2s ease;
      margin-top: 6px;
      margin-bottom: 12px;
      direction: ltr;
    }

    .middle-section.shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .equation-box {
      min-width: 160px;
      height: 52px;
      padding: 0 12px;
      border: 3px solid #0288d1;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      font-weight: bold;
      background-color: #ffffff;
      color: #000000;
      box-shadow: 0 0 0 6px rgba(255, 248, 214, 0.9), 0 4px 0 #0288d1;
      letter-spacing: 2px;
      white-space: pre;
    }

    .target-equals {
      font-size: 1.9rem;
      font-weight: bold;
      color: #0288d1;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: -2px -2px 0 #fff8d6, 2px -2px 0 #fff8d6, -2px 2px 0 #fff8d6, 2px 2px 0 #fff8d6;
    }

    .bottom-section {
      width: 100%;
      max-width: 380px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 0 0 6px #fff8d6, 0 4px 12px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(2px);
    }

    .keypad-container-static {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .unified-pad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 46px);
      gap: 6px;
      width: 100%;
      direction: ltr;
    }

    /* Key Base Styles */
    .key-btn {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    /* Digit Key Colors (Neutral Wood) */
    .num-key {
      border: 3px solid #8d6e63;
      background-color: #ffffff;
      color: #5d4037;
      box-shadow: 0 3px 0 #8d6e63;
    }

    .num-key:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #8d6e63;
    }

    /* Operator Key Colors (Distinct Blue) */
    .op-key {
      border: 3px solid #0288d1;
      background-color: #e1f5fe;
      color: #01579b;
      font-size: 1.5rem;
      box-shadow: 0 3px 0 #0288d1;
    }

    .op-key:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0288d1;
    }

    .key-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
      box-shadow: none;
      background-color: #e0e0e0;
      border-color: #9e9e9e;
      color: #757575;
    }

    /* Delete Key Colors */
    .clear-btn-large {
      grid-column: span 2;
      font-size: 1.15rem;
      background-color: #ffffff;
      border: 3px solid #d32f2f;
      color: #b71c1c;
      box-shadow: 0 3px 0 #b71c1c;
    }

    .clear-btn-large:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b71c1c;
    }

    .check-btn-wide {
      width: 100%;
      padding: 10px;
      font-size: 1.25rem;
      font-weight: bold;
      background-color: #ffffff;
      color: #2e7d32;
      border: 3px solid #2e7d32;
      border-radius: 16px;
      box-shadow: 0 4px 0 #1b5e20;
      cursor: pointer;
      direction: rtl;
    }

    .check-btn-wide:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      background-color: #f5f5f5;
      border-color: #b0bec5;
      color: #90a4ae;
    }

    .check-btn-wide:not(:disabled):active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1b5e20;
      background-color: #e8f5e9;
    }

    .victory-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      align-items: center;
    }

    .replay-btn {
      padding: 10px 20px;
      font-size: 1.15rem;
      font-weight: bold;
      background-color: #0288d1;
      color: white;
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 0 #01579b;
      cursor: pointer;
      direction: rtl;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .replay-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #01579b;
    }

    .feedback-emoji {
      font-size: 6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      margin: auto;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .next-btn {
      padding: 14px 28px;
      font-size: 1.35rem;
      font-weight: bold;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 0 #2e7d32;
      cursor: pointer;
      direction: rtl;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2e7d32;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="header-bar">
    <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
  </div>

  <div class="top-section">
    <div class="progress-wrapper">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="image-container" id="imageContainer">
      <img id="gameImage" src="" alt="Hidden Item" />
      <div class="grid-overlay" id="gridOverlay"></div>
    </div>
    <div class="name-box" id="itemName"></div>
    <div class="divider"></div>
  </div>

  <div class="middle-section" id="middleSection">
    <div class="equation-box" id="equationDisplay"></div>
    <div class="target-equals" id="targetDisplay">= ?</div>
  </div>

  <div class="bottom-section" id="keypadContainer"></div>
</div>

<script>
  const itemBank = [
    { name: "אלביס פרסלי",    image: "./images_game_001/elvis.webp" },
    { name: "ביבי המלך",   image: "./images_game_001/bibi.jpg" },
    { name: "החיפושיות", image: "./images_game_001/beatles.jpg" },
    { name: "אריאל שרון", image: "./images_game_001/sharon.jpg" },
    { name: "פרנק סינטרה",    image: "./images_game_001/sinatra.jpg" },
    { name: "דני קיי",   image: "./images_game_001/danny-kaye.jpg" },
    { name: "רפאל איתן", image: "./images_game_001/raful.jpg" },
    { name: "דוד בן-גוריון", image: "./images_game_001/ben-gurion.jpg" },
    { name: "רחבעם זאבי", image: "./images_game_001/gandi.jpg" },
    { name: "וינסטון צ'רצ'יל", image: "./images_game_001/cherchil.jpg" },
    { name: "עפרה חזה", image: "./images_game_001/ofra-haza.jpg" },
    { name: "נפוליאון", image: "./images_game_001/napoleon.jpg" },
    { name: "שושנה דמארי", image: "./images_game_001/shoshana.jpg" },
    { name: "יול ברנר", image: "./images_game_001/yul-brynner.jpg" },
    { name: "קירק דאגלס", image: "./images_game_001/kirk-douglas.jpg" },
    
    { name: "אלי יצפאן", image: "./images_game_001/yatzpan.jpg" },
    { name: "דונלד דאק", image: "./images_game_001/donald.jpg" },
    { name: "מיקי מאוס", image: "./images_game_001/mickey.jpg" },
    { name: "יצחק רבין", image: "./images_game_001/rabin.jpg" },
  ];

  let availableIndices = [];
  let currentItemIndex = null;
  let hiddenTiles = [];
  let revealedTiles = [];
  let totalTilesInRound = 0;
  
  let num1 = '';
  let op = '';
  let num2 = '';

  let targetValue = 0;
  let revealedImagesCount = 0;
  let isProcessingAnswer = false;
  let isMuted = false;

  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();
  const soundBuffers = {};
  let currentImageAudio = null;

  const soundFiles = {
    click: 'sounds/click.wav',
    success: 'sounds/success.wav',
    error: 'sounds/error.wav',
    victory: 'sounds/victory.wav'
  };

  window.addEventListener('click', ensureAudioContext, { once: true });
  window.addEventListener('touchstart', ensureAudioContext, { once: true });

  function ensureAudioContext() {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  async function preloadSounds() {
    for (const [key, path] of Object.entries(soundFiles)) {
      try {
        const response = await fetch(path);
        if (response.ok) {
          const arrayBuffer = await response.arrayBuffer();
          soundBuffers[key] = await audioCtx.decodeAudioData(arrayBuffer);
        }
      } catch (e) {
        console.warn(`Could not load audio file ${path}, synthesized sound will be used instead.`);
      }
    }
  }
  preloadSounds();

  function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
    if (isMuted) {
      stopImageSound();
    }
  }

  function playSound(key, fallbackFn) {
    if (isMuted) return;
    ensureAudioContext();
    if (soundBuffers[key]) {
      const source = audioCtx.createBufferSource();
      source.buffer = soundBuffers[key];
      source.connect(audioCtx.destination);
      source.start(0);
    } else if (fallbackFn) {
      fallbackFn();
    }
  }

  function synthClickSound() {
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(1800, now);
    osc1.frequency.exponentialRampToValueAtTime(400, now + 0.025);
    gain1.gain.setValueAtTime(0.35, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.025);
  }

  function synthSuccessSound() {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(783.99, now + 0.12);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  }

  function synthErrorSound() {
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(329.63, now);
    gain1.gain.setValueAtTime(0.2, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.18);

    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(246.94, now + 0.12);
    gain2.gain.setValueAtTime(0.2, now + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now + 0.12);
    osc2.stop(now + 0.35);
  }

  function synthVictoryTune() {
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    const noteDuration = 0.12;

    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * noteDuration);
      const duration = (idx === notes.length - 1) ? 0.4 : noteDuration;
      gain.gain.setValueAtTime(0.35, now + idx * noteDuration);
      gain.gain.exponentialRampToValueAtTime(0.01, now + idx * noteDuration + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * noteDuration);
      osc.stop(now + idx * noteDuration + duration);
    });
  }

  function playClickSound() { playSound('click', synthClickSound); }
  function playSuccessSound() { playSound('success', synthSuccessSound); }
  function playErrorSound() { playSound('error', synthErrorSound); }
  function playVictoryTune() { playSound('victory', synthVictoryTune); }

  function playImageSound() {
    stopImageSound();
    if (isMuted) return;
    ensureAudioContext();

    const currentItem = itemBank[currentItemIndex];
    if (!currentItem || !currentItem.image) return;

    const baseName = currentItem.image.split('/').pop().split('.')[0];
    const soundPath = `sounds_game_001/${baseName}.ogg`;
    
    const audio = new Audio(soundPath);
    currentImageAudio = audio;

    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.catch(error => {
        const mp3Fallback = new Audio(`sounds_game_001/${baseName}.mp3`);
        currentImageAudio = mp3Fallback;
        mp3Fallback.play().catch(e => {
          console.warn(`Audio playback failed for sounds_game_001/${baseName}.ogg or .mp3:`, e);
        });
      });
    }
  }

  function stopImageSound() {
    if (currentImageAudio) {
      currentImageAudio.pause();
      currentImageAudio.currentTime = 0;
      currentImageAudio = null;
    }
  }

  function getGridDimensions(imagesCompleted) {
    if (imagesCompleted < 2) return 2;  
    if (imagesCompleted < 4) return 3;  
    if (imagesCompleted < 7) return 4; 
    return 5;                           
  }

  function getTargetResultRange(roundNumber) {
    if (roundNumber === 1) return { min: 0, max: 20 };
    if (roundNumber === 2) return { min: 0, max: 50 };
    if (roundNumber === 3 || roundNumber === 4) return { min: 30, max: 100 };
    return { min: 50, max: 999 };
  }

  function getNextImageIndex() {
    if (availableIndices.length === 0) {
      availableIndices = Array.from({ length: itemBank.length }, (_, i) => i);
    }
    const randomIndex = Math.floor(Math.random() * availableIndices.length);
    return availableIndices.splice(randomIndex, 1)[0];
  }

  function updateProgressBar() {
    const revealedTilesCount = totalTilesInRound - hiddenTiles.length;
    const percentage = totalTilesInRound > 0 ? (revealedTilesCount / totalTilesInRound) * 100 : 0;
    document.getElementById('progressBar').style.width = `${percentage}%`;
  }

  function updatePartialNameDisplay() {
    updateProgressBar();

    const currentName = itemBank[currentItemIndex].name;
    const totalChars = currentName.length;
    const revealedTilesCount = totalTilesInRound - hiddenTiles.length;

    const charsToShowCount = Math.floor((revealedTilesCount / totalTilesInRound) * totalChars);

    if (charsToShowCount === 0) {
      document.getElementById('itemName').textContent = '.'.repeat(Math.min(totalChars, 6));
      return;
    }

    if (charsToShowCount >= totalChars) {
      document.getElementById('itemName').textContent = currentName;
      return;
    }

    const visiblePart = currentName.slice(0, charsToShowCount);
    const hiddenPart = '.'.repeat(totalChars - charsToShowCount);

    document.getElementById('itemName').textContent = visiblePart + hiddenPart;
  }

  function startRound() {
    stopImageSound();
    currentItemIndex = getNextImageIndex();
    const currentItem = itemBank[currentItemIndex];
    
    const imgElement = document.getElementById('gameImage');
    imgElement.src = currentItem.image;

    document.getElementById('middleSection').style.display = 'flex';

    const gridSize = getGridDimensions(revealedImagesCount);
    totalTilesInRound = gridSize * gridSize;

    const gridOverlay = document.getElementById('gridOverlay');
    gridOverlay.innerHTML = '';
    gridOverlay.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    gridOverlay.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

    hiddenTiles = Array.from({ length: totalTilesInRound }, (_, index) => index);
    revealedTiles = [];

    for (let i = 0; i < totalTilesInRound; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${i}`;
      gridOverlay.appendChild(tile);
    }

    updatePartialNameDisplay();
    generateEquation();
    renderStaticKeypad();
    resetEquationDisplay();
  }
  
  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateEquation() {
    const ops = ['+', '-', '×', '÷'];
    const selectedOp = ops[Math.floor(Math.random() * ops.length)];
    const roundNumber = revealedImagesCount + 1;
    const resultRange = getTargetResultRange(roundNumber);

    let n1, n2, target;
    let valid = false;
    let attempts = 0;

    while (!valid && attempts < 500) {
      attempts++;

      if (selectedOp === '+') {
        target = getRandomInt(resultRange.min, resultRange.max);
        n1 = getRandomInt(0, target);
        n2 = target - n1;
      } else if (selectedOp === '-') {
        target = getRandomInt(resultRange.min, resultRange.max);
        n2 = getRandomInt(0, 50); 
        n1 = target + n2;
      } else if (selectedOp === '×') {
        n1 = getRandomInt(1, 12);
        n2 = getRandomInt(0, Math.floor(resultRange.max / n1));
        target = n1 * n2;
      } else if (selectedOp === '÷') {
        n2 = getRandomInt(1, 10);
        target = getRandomInt(resultRange.min, resultRange.max);
        n1 = target * n2;
      }

      if (n1 <= 99 && n2 <= 99 && target >= resultRange.min && target <= resultRange.max) {
        valid = true;
      }
    }

    targetValue = target;
    document.getElementById('targetDisplay').textContent = `= ${targetValue}`;
    resetEquationDisplay();
  }

  function resetEquationDisplay() {
    num1 = '';
    op = '';
    num2 = '';
    updateDisplay();
  }

  function updateDisplay() {
    const displayEl = document.getElementById('equationDisplay');
    let text = '';
    if (num1 !== '') text += num1;
    if (op !== '') text += ` ${op} `;
    if (num2 !== '') text += num2;

    displayEl.textContent = text;
    updateKeypadStates();
  }

  function renderStaticKeypad() {
    const container = document.getElementById('keypadContainer');
    container.innerHTML = `
      <div class="keypad-container-static">
        <div class="unified-pad">
          <button class="key-btn num-key" onclick="handleNumInput('1')">1</button>
          <button class="key-btn num-key" onclick="handleNumInput('2')">2</button>
          <button class="key-btn num-key" onclick="handleNumInput('3')">3</button>
          <button class="key-btn op-key" onclick="handleOpInput('+')">+</button>
          <button class="key-btn op-key" onclick="handleOpInput('-')">-</button>

          <button class="key-btn num-key" onclick="handleNumInput('4')">4</button>
          <button class="key-btn num-key" onclick="handleNumInput('5')">5</button>
          <button class="key-btn num-key" onclick="handleNumInput('6')">6</button>
          <button class="key-btn op-key" onclick="handleOpInput('×')">×</button>
          <button class="key-btn op-key" onclick="handleOpInput('÷')">÷</button>

          <button class="key-btn num-key" onclick="handleNumInput('7')">7</button>
          <button class="key-btn num-key" onclick="handleNumInput('8')">8</button>
          <button class="key-btn num-key" onclick="handleNumInput('9')">9</button>
          <button class="key-btn clear-btn-large" id="clearBtn" onclick="handleDelete()">מחק</button>

          <button class="key-btn num-key zero-btn" id="keyZero" style="grid-column: 2;" onclick="handleNumInput('0')">0</button>
        </div>

        <button class="check-btn-wide" id="checkBtn" onclick="checkSolution()" disabled>בדוק משוואה</button>
      </div>
    `;
    updateKeypadStates();
  }

  function updateKeypadStates() {
    let digitsAllowed = false;

    if (op === '') {
      if (num1.length < 2) {
        digitsAllowed = true;
      }
    } else {
      if (num2.length < 2) {
        digitsAllowed = true;
      }
    }

    document.querySelectorAll('.num-key').forEach(btn => {
      btn.classList.toggle('disabled', !digitsAllowed);
    });

    const opsAllowed = num1 !== '' && num2 === '';
    document.querySelectorAll('.op-key').forEach(btn => {
      btn.classList.toggle('disabled', !opsAllowed);
    });

    const checkBtn = document.getElementById('checkBtn');
    if (checkBtn) {
      const isValidEquation = num1 !== '' && op !== '' && num2 !== '';
      checkBtn.disabled = !isValidEquation;
    }
  }

  function handleNumInput(digit) {
    if (isProcessingAnswer) return;

    if (op === '') {
      if (num1.length < 2) {
        num1 += digit;
        playClickSound();
      }
    } else {
      if (num2.length < 2) {
        num2 += digit;
        playClickSound();
      }
    }

    updateDisplay();
  }

  function handleOpInput(selectedOp) {
    if (isProcessingAnswer) return;
    if (num1 === '') return;

    playClickSound();
    op = selectedOp;
    updateDisplay();
  }

  function handleDelete() {
    if (isProcessingAnswer) return;
    playClickSound();

    if (num2 !== '') {
      num2 = num2.slice(0, -1);
    } else if (op !== '') {
      op = '';
    } else if (num1 !== '') {
      num1 = num1.slice(0, -1);
    }

    updateDisplay();
  }

  function showFeedback(emoji) {
    const container = document.getElementById('keypadContainer');
    container.innerHTML = `<div class="feedback-emoji">${emoji}</div>`;
  }

  function checkSolution() {
    if (num1 === '' || op === '' || num2 === '' || isProcessingAnswer) return;

    isProcessingAnswer = true;

    const n1 = parseInt(num1, 10);
    const n2 = parseInt(num2, 10);
    let result = null;

    if (op === '+') result = n1 + n2;
    if (op === '-') result = n1 - n2;
    if (op === '×') result = n1 * n2;
    if (op === '÷') result = n2 !== 0 ? n1 / n2 : null;

    if (result === targetValue) {
      playSuccessSound();
      showFeedback('😊');
      
      setTimeout(() => {
        isProcessingAnswer = false;
        revealRandomTile();
      }, 1500);
    } else {
      playErrorSound();
      showFeedback('😢');

      const targetEl = document.getElementById('targetDisplay');
      const originalTargetText = `= ${targetValue}`;
      
      targetEl.textContent = `= ${result} ❌`;
      targetEl.style.color = '#d32f2f';

      const middleSection = document.getElementById('middleSection');
      middleSection.classList.add('shake');

      if (revealedTiles.length > 0) {
        const tileToHide = revealedTiles.pop();
        hiddenTiles.push(tileToHide);
        document.getElementById(`tile-${tileToHide}`).classList.remove('revealed');
        updatePartialNameDisplay();
      }

      setTimeout(() => {
        targetEl.textContent = originalTargetText;
        targetEl.style.color = '#0288d1';
        middleSection.classList.remove('shake');

        resetEquationDisplay();

        isProcessingAnswer = false;
        renderStaticKeypad();
      }, 2200);
    }
  }

  function revealRandomTile() {
    if (hiddenTiles.length > 0) {
      const randomIndex = Math.floor(Math.random() * hiddenTiles.length);
      const tileToReveal = hiddenTiles.splice(randomIndex, 1)[0];
      revealedTiles.push(tileToReveal);
      document.getElementById(`tile-${tileToReveal}`).classList.add('revealed');
    }

    updatePartialNameDisplay();

    if (hiddenTiles.length === 0) {
      playVictoryTune();
      playImageSound();

      document.getElementById('middleSection').style.display = 'none';

      const container = document.getElementById('keypadContainer');
      container.innerHTML = `
        <div class="victory-controls">
          <button class="replay-btn" onclick="playImageSound()">🔊 השמע שוב</button>
          <button class="next-btn" onclick="nextRound()">... יופי טופי. הבא בתור</button>
        </div>
      `;
    } else {
      generateEquation();
      renderStaticKeypad();
    }
  }

  function nextRound() {
    playClickSound();
    stopImageSound();
    revealedImagesCount++;
    startRound();
  }

  startRound();
</script>
</body>
</html>
