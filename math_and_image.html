<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Math Image Reveal</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #cfd8dc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      position: relative;
      width: 100vw;
      max-width: 520px;
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px;
      
      background-color: #fff8d6;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      border: 4px solid #ffffff;
      overflow: hidden;
    }

    #app::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900"><g font-family="sans-serif" font-weight="bold" font-size="28" text-anchor="middle" dominant-baseline="central"><rect x="25" y="15" width="55" height="55" rx="10" fill="%23ff5252" transform="rotate(-8 52 42)"/><text x="52" y="42" fill="white" transform="rotate(-8 52 42)">8</text><rect x="135" y="10" width="55" height="55" rx="10" fill="%23448aff" transform="rotate(6 162 37)"/><text x="162" y="37" fill="white" transform="rotate(6 162 37)">5</text><rect x="250" y="12" width="55" height="55" rx="10" fill="%23ffd740" transform="rotate(-12 277 39)"/><text x="277" y="39" fill="%23d84315" transform="rotate(-12 277 39)">-</text><rect x="355" y="10" width="55" height="55" rx="10" fill="%2369f0ae" transform="rotate(10 382 37)"/><text x="382" y="37" fill="%231b5e20" transform="rotate(10 382 37)">2</text><rect x="440" y="20" width="55" height="55" rx="10" fill="%23ffab40" transform="rotate(-15 467 47)"/><text x="467" y="47" fill="%233e2723" transform="rotate(-15 467 47)">=</text><rect x="10" y="160" width="55" height="55" rx="10" fill="%23ff4081" transform="rotate(15 37 187)"/><text x="37" y="187" fill="white" transform="rotate(15 37 187)">6</text><rect x="455" y="180" width="55" height="55" rx="10" fill="%23ff6e40" transform="rotate(-18 482 207)"/><text x="482" y="207" fill="white" transform="rotate(-18 482 207)">2</text><rect x="8" y="390" width="55" height="55" rx="10" fill="%23ffd740" transform="rotate(-10 35 417)"/><text x="35" y="417" fill="%23b71c1c" transform="rotate(-10 35 417)">1</text><rect x="455" y="410" width="55" height="55" rx="10" fill="%23ff4081" transform="rotate(12 482 437)"/><text x="482" y="437" fill="white" transform="rotate(12 482 437)">0</text><rect x="12" y="620" width="55" height="55" rx="10" fill="%2369f0ae" transform="rotate(18 39 647)"/><text x="39" y="647" fill="%231b5e20" transform="rotate(18 39 647)">2</text><rect x="452" y="610" width="55" height="55" rx="10" fill="%23ffab40" transform="rotate(-8 479 637)"/><text x="479" y="637" fill="%233e2723" transform="rotate(-8 479 637)">1</text></g></svg>');
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    @media (max-width: 540px) {
      #app {
        border-radius: 0;
        max-height: 100vh;
        border: none;
      }
    }

    .top-section, .middle-section, .bottom-section {
      position: relative;
      z-index: 1;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 12px;
    }

    .image-container {
      position: relative;
      width: 280px;
      height: 280px;
      border: 4px solid #0288d1;
      border-radius: 16px;
      background-color: #ffffff;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(2, 136, 209, 0.2);
    }

    #gameImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      background-color: transparent;
      z-index: 2;
    }

    .tile {
      background-color: #81d4fa;
      border: 1px solid #0288d1;
      box-sizing: border-box;
      transition: opacity 0.4s ease;
    }

    .tile.revealed {
      opacity: 0;
      pointer-events: none;
    }

    .name-box {
      width: 260px;
      padding: 6px 12px;
      border: 3px solid #2e7d32;
      border-radius: 12px;
      text-align: center;
      font-size: 1.7rem;
      font-weight: bold;
      letter-spacing: 2px;
      background-color: #ffffff;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2e7d32;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.15);
      direction: rtl;
      unicode-bidi: isolate;
    }

    .divider {
      width: 85%;
      height: 3px;
      background-color: #ffe082;
      border-radius: 2px;
      margin: 2px 0;
    }

    .middle-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      transition: opacity 0.2s ease;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .slot {
      width: 72px;
      height: 64px;
      border: 3px solid #0288d1;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      background-color: #ffffff;
      color: #0288d1;
      cursor: pointer;
      box-shadow: 0 4px 0 #0288d1;
    }

    .slot.active {
      background-color: #ffeb3b;
      color: #000000;
      border-color: #fbc02d;
      box-shadow: 0 4px 0 #fbc02d;
    }

    .target-equals {
      font-size: 2.2rem;
      font-weight: bold;
      color: #37474f;
      margin-left: 6px;
    }

    .bottom-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    .keypad-container-static {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      height: 100%;
    }

    .keypad-columns {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      direction: ltr;
      flex: 1;
    }

    .digits-grid {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      gap: 8px;
      direction: ltr;
    }

    .ops-grid {
      display: grid;
      grid-template-columns: repeat(2, 52px);
      gap: 8px;
      direction: ltr;
    }

    .key-btn {
      width: 52px;
      height: 46px;
      border: 3px solid #8d6e63;
      border-radius: 12px;
      background-color: #ffffff;
      color: #5d4037;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #8d6e63;
      cursor: pointer;
      user-select: none;
    }

    .key-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #8d6e63;
    }

    .key-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
      box-shadow: none;
      background-color: #e0e0e0;
      border-color: #9e9e9e;
      color: #757575;
    }

    .clear-btn-large {
      grid-column: span 2;
      grid-row: span 2;
      width: 112px;
      height: 100px;
      font-size: 1.4rem;
      border: 3px solid #d32f2f;
      color: #b71c1c;
      box-shadow: 0 4px 0 #b71c1c;
    }

    .clear-btn-large:active {
      border-color: #b71c1c;
      box-shadow: 0 2px 0 #b71c1c;
    }

    .check-btn-wide {
      width: 220px;
      padding: 10px;
      font-size: 1.35rem;
      font-weight: bold;
      background-color: #ffffff;
      color: #2e7d32;
      border: 3px solid #2e7d32;
      border-radius: 20px;
      box-shadow: 0 4px 0 #1b5e20;
      cursor: pointer;
      direction: rtl;
      margin-bottom: 24px;
    }

    .check-btn-wide:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      box-shadow: none;
      background-color: #f5f5f5;
      border-color: #b0bec5;
      color: #90a4ae;
    }

    .check-btn-wide:not(:disabled):active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1b5e20;
      background-color: #e8f5e9;
    }

    .feedback-emoji {
      font-size: 8.5rem;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .next-btn {
      padding: 16px 32px;
      font-size: 1.5rem;
      font-weight: bold;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 0 #2e7d32;
      cursor: pointer;
      direction: rtl;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2e7d32;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="top-section">
    <div class="image-container" id="imageContainer">
      <img id="gameImage" src="" alt="Hidden Item" />
      <div class="grid-overlay" id="gridOverlay"></div>
    </div>
    <div class="name-box" id="itemName"></div>
    <div class="divider"></div>
  </div>

  <div class="middle-section" id="middleSection">
    <div class="slot active" id="slot0" onclick="selectSlot(0)">?</div>
    <div class="slot" id="slot1" onclick="selectSlot(1)">?</div>
    <div class="slot" id="slot2" onclick="selectSlot(2)">?</div>
    <div class="target-equals" id="targetDisplay">= ?</div>
  </div>

  <div class="bottom-section" id="keypadContainer"></div>
</div>

<script>
  const itemBank = [
    { name: "אלביס פרסלי",    image: "./images_game_001/elvis.webp" },
    { name: "ביבי המלך",   image: "./images_game_001/bibi.jpg" },
    { name: "החיפושיות", image: "./images_game_001/beatles.jpg" },
    { name: "אריאל שרון", image: "./images_game_001/sharon.jpg" },
    { name: "פרנק סינטרה",    image: "./images_game_001/sinatra.jpg" },
    { name: "דני קיי",   image: "./images_game_001/danny-kaye.jpg" },
    { name: "רפאל איתן", image: "./images_game_001/raful.jpg" },
    { name: "דוד בן-גוריון", image: "./images_game_001/ben-gurion.jpg" },
    { name: "רחבעם זאבי", image: "./images_game_001/gandi.jpg" },
    { name: "וינסטון צ'רצ'יל", image: "./images_game_001/cherchil.jpg" },
    { name: "עפרה חזה", image: "./images_game_001/ofra-haza.jpg" },
    { name: "נפוליאון", image: "./images_game_001/napoleon.jpg" },
    { name: "שושנה דמארי", image: "./images_game_001/shoshana.jpg" },
    { name: "יול ברנר", image: "./images_game_001/yul-brynner.jpg" },
    { name: "קירק דאגלס", image: "./images_game_001/kirk-douglas.jpg" },
  ];

  let availableIndices = [];
  let currentItemIndex = null;
  let hiddenTiles = [];
  let totalTilesInRound = 0;
  let activeSlot = 0;
  const slotValues = [null, null, null];
  let targetValue = 0;
  let revealedImagesCount = 0;
  let isProcessingAnswer = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function ensureAudioContext() {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playClickSound() {
    ensureAudioContext();
    const now = audioCtx.currentTime;

    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(1800, now);
    osc1.frequency.exponentialRampToValueAtTime(400, now + 0.025);
    gain1.gain.setValueAtTime(0.35, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.025);

    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(600, now);
    osc2.frequency.exponentialRampToValueAtTime(120, now + 0.035);
    gain2.gain.setValueAtTime(0.2, now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now);
    osc2.stop(now + 0.035);
  }

  function playSuccessSound() {
    ensureAudioContext();
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(783.99, now + 0.12);

    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.35);
  }

  function playErrorSound() {
    ensureAudioContext();
    const now = audioCtx.currentTime;

    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(329.63, now);
    gain1.gain.setValueAtTime(0.2, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.18);

    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(246.94, now + 0.12);
    gain2.gain.setValueAtTime(0.2, now + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now + 0.12);
    osc2.stop(now + 0.35);
  }

  function playVictoryTune() {
    ensureAudioContext();
    const now = audioCtx.currentTime;
    
    const notes = [523.25, 659.25, 783.99, 1046.50];
    const noteDuration = 0.12;

    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * noteDuration);

      const duration = (idx === notes.length - 1) ? 0.4 : noteDuration;

      gain.gain.setValueAtTime(0.35, now + idx * noteDuration);
      gain.gain.exponentialRampToValueAtTime(0.01, now + idx * noteDuration + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now + idx * noteDuration);
      osc.stop(now + idx * noteDuration + duration);
    });
  }

  function getGridDimensions(imagesCompleted) {
    if (imagesCompleted < 2) return 2;  
    if (imagesCompleted < 4) return 3;  
    if (imagesCompleted < 7) return 4; 
    return 5;                           
  }

  function getNextImageIndex() {
    if (availableIndices.length === 0) {
      availableIndices = Array.from({ length: itemBank.length }, (_, i) => i);
    }
    const randomIndex = Math.floor(Math.random() * availableIndices.length);
    return availableIndices.splice(randomIndex, 1)[0];
  }

  function updatePartialNameDisplay() {
    const currentName = itemBank[currentItemIndex].name;
    const totalChars = currentName.length;
    const revealedTilesCount = totalTilesInRound - hiddenTiles.length;

    const charsToShowCount = Math.floor((revealedTilesCount / totalTilesInRound) * totalChars);

    if (charsToShowCount === 0) {
      document.getElementById('itemName').textContent = '.'.repeat(Math.min(totalChars, 6));
      return;
    }

    if (charsToShowCount >= totalChars) {
      document.getElementById('itemName').textContent = currentName;
      return;
    }

    const visiblePart = currentName.slice(0, charsToShowCount);
    const hiddenPart = '.'.repeat(totalChars - charsToShowCount);

    document.getElementById('itemName').textContent = visiblePart + hiddenPart;
  }

  function startRound() {
    currentItemIndex = getNextImageIndex();
    const currentItem = itemBank[currentItemIndex];
    
    const imgElement = document.getElementById('gameImage');
    imgElement.src = currentItem.image;

    document.getElementById('middleSection').style.display = 'flex';

    const gridSize = getGridDimensions(revealedImagesCount);
    totalTilesInRound = gridSize * gridSize;

    const gridOverlay = document.getElementById('gridOverlay');
    gridOverlay.innerHTML = '';
    gridOverlay.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    gridOverlay.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

    hiddenTiles = Array.from({ length: totalTilesInRound }, (_, index) => index);

    for (let i = 0; i < totalTilesInRound; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${i}`;
      gridOverlay.appendChild(tile);
    }

    updatePartialNameDisplay();
    generateEquation();
    renderStaticKeypad();
    selectSlot(0, false);
  }
  
  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateEquation() {
    let minTarget, maxTarget;

    if (revealedImagesCount < 2) {
      minTarget = 1;
      maxTarget = 49;
    } else if (revealedImagesCount < 4) {
      minTarget = 1;
      maxTarget = 99;
    } else if (revealedImagesCount < 7) {
      minTarget = 51;
      maxTarget = 499;
    } else {
      minTarget = 101;
      maxTarget = 999;
    }

    const ops = ['+', '-', '×', '÷'];
    const op = ops[Math.floor(Math.random() * ops.length)];
    let n1, n2, target;

    let valid = false;
    let attempts = 0;

    while (!valid && attempts < 200) {
      attempts++;
      if (op === '+') {
        n1 = getRandomInt(0, maxTarget);
        n2 = getRandomInt(0, maxTarget);
        target = n1 + n2;
      } else if (op === '-') {
        n1 = getRandomInt(0, maxTarget + 50);
        n2 = getRandomInt(0, n1);
        target = n1 - n2;
      } else if (op === '×') {
        n1 = getRandomInt(1, 50);
        n2 = getRandomInt(1, 20);
        target = n1 * n2;
      } else if (op === '÷') {
        n2 = getRandomInt(1, 20);
        target = getRandomInt(minTarget, Math.min(maxTarget, 99));
        n1 = target * n2;
      }

      if (target >= minTarget && target <= maxTarget) {
        valid = true;
      }
    }

    targetValue = target;
    document.getElementById('targetDisplay').textContent = `= ${targetValue}`;
    
    slotValues[0] = null;
    slotValues[1] = null;
    slotValues[2] = null;

    document.getElementById('slot0').textContent = '?';
    document.getElementById('slot1').textContent = '?';
    document.getElementById('slot2').textContent = '?';
  }

  function renderStaticKeypad() {
    const container = document.getElementById('keypadContainer');
    container.innerHTML = `
      <div class="keypad-container-static">
        <div class="keypad-columns">
          <div class="digits-grid" id="digitsPad">
            <button class="key-btn num-key" onclick="handleNumInput(1)">1</button>
            <button class="key-btn num-key" onclick="handleNumInput(2)">2</button>
            <button class="key-btn num-key" onclick="handleNumInput(3)">3</button>
            <button class="key-btn num-key" onclick="handleNumInput(4)">4</button>
            <button class="key-btn num-key" onclick="handleNumInput(5)">5</button>
            <button class="key-btn num-key" onclick="handleNumInput(6)">6</button>
            <button class="key-btn num-key" onclick="handleNumInput(7)">7</button>
            <button class="key-btn num-key" onclick="handleNumInput(8)">8</button>
            <button class="key-btn num-key" onclick="handleNumInput(9)">9</button>
            <button class="key-btn mod-key" onclick="handleTenModifier(10)">+10</button>
            <button class="key-btn num-key" onclick="handleNumInput(0)">0</button>
            <button class="key-btn mod-key" onclick="handleTenModifier(-10)">-10</button>
          </div>

          <div class="ops-grid" id="opsPad">
            <button class="key-btn op-key" onclick="handleOpInput('+')">+</button>
            <button class="key-btn op-key" onclick="handleOpInput('-')">-</button>
            <button class="key-btn op-key" onclick="handleOpInput('×')">×</button>
            <button class="key-btn op-key" onclick="handleOpInput('÷')">÷</button>
            <button class="key-btn clear-btn-large" id="clearBtn" onclick="handleClear()">מחק</button>
          </div>
        </div>

        <button class="check-btn-wide" id="checkBtn" onclick="checkSolution()" disabled>בדוק משוואה</button>
      </div>
    `;
    updateKeypadStates();
  }

  function updateKeypadStates() {
    const isNumberSlot = activeSlot === 0 || activeSlot === 2;
    const isOperatorSlot = activeSlot === 1;

    document.querySelectorAll('.num-key, .mod-key').forEach(btn => {
      btn.classList.toggle('disabled', !isNumberSlot);
    });

    document.querySelectorAll('.op-key').forEach(btn => {
      btn.classList.toggle('disabled', !isOperatorSlot);
    });

    const checkBtn = document.getElementById('checkBtn');
    if (checkBtn) {
      const isComplete = slotValues[0] !== null && slotValues[1] !== null && slotValues[2] !== null;
      checkBtn.disabled = !isComplete;
    }
  }

  function selectSlot(index, playSound = true) {
    if (isProcessingAnswer) return;
    if (playSound) playClickSound();

    activeSlot = index;
    document.querySelectorAll('.slot').forEach((s, idx) => {
      s.classList.toggle('active', idx === activeSlot);
    });
    updateKeypadStates();
  }

  function handleNumInput(val) {
    if (isProcessingAnswer || activeSlot === 1) return;
    playClickSound();

    slotValues[activeSlot] = val;
    document.getElementById(`slot${activeSlot}`).textContent = val;

    updateKeypadStates();
  }

  function handleOpInput(op) {
    if (isProcessingAnswer || activeSlot !== 1) return;
    playClickSound();

    slotValues[1] = op;
    document.getElementById('slot1').textContent = op;

    selectSlot(2, false);
  }

  function handleTenModifier(delta) {
    if (isProcessingAnswer || activeSlot === 1) return;
    playClickSound();

    let currentVal = slotValues[activeSlot] !== null ? parseInt(slotValues[activeSlot]) : 0;
    let newVal = currentVal + delta;

    if (newVal < 0 || newVal > 999) {
      newVal = currentVal;
    }

    slotValues[activeSlot] = newVal;
    document.getElementById(`slot${activeSlot}`).textContent = newVal;

    updateKeypadStates();
  }

  function handleClear() {
    if (isProcessingAnswer) return;
    playClickSound();

    slotValues[activeSlot] = null;
    document.getElementById(`slot${activeSlot}`).textContent = '?';
    updateKeypadStates();
  }

  function showFeedback(emoji) {
    const container = document.getElementById('keypadContainer');
    container.innerHTML = `<div class="feedback-emoji">${emoji}</div>`;
  }

  function checkSolution() {
    if (slotValues.includes(null) || isProcessingAnswer) return;

    isProcessingAnswer = true;
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));

    const num1 = parseInt(slotValues[0]);
    const op = slotValues[1];
    const num2 = parseInt(slotValues[2]);
    let result = null;

    if (op === '+') result = num1 + num2;
    if (op === '-') result = num1 - num2;
    if (op === '×') result = num1 * num2;
    if (op === '÷') result = num2 !== 0 ? num1 / num2 : null;

    if (result === targetValue) {
      playSuccessSound();
      showFeedback('😊');
      
      setTimeout(() => {
        isProcessingAnswer = false;
        revealRandomTile();
      }, 1500);
    } else {
      playErrorSound();
      showFeedback('😢');
      const middleSection = document.getElementById('middleSection');
      middleSection.style.opacity = '0.3';

      setTimeout(() => {
        middleSection.style.opacity = '1';
        slotValues[0] = null;
        slotValues[1] = null;
        slotValues[2] = null;

        document.getElementById('slot0').textContent = '?';
        document.getElementById('slot1').textContent = '?';
        document.getElementById('slot2').textContent = '?';

        isProcessingAnswer = false;
        renderStaticKeypad();
        selectSlot(0, false);
      }, 1500);
    }
  }

  function revealRandomTile() {
    if (hiddenTiles.length > 0) {
      const randomIndex = Math.floor(Math.random() * hiddenTiles.length);
      const tileToReveal = hiddenTiles.splice(randomIndex, 1)[0];
      document.getElementById(`tile-${tileToReveal}`).classList.add('revealed');
    }

    updatePartialNameDisplay();

    if (hiddenTiles.length === 0) {
      playVictoryTune();

      document.getElementById('middleSection').style.display = 'none';

      const container = document.getElementById('keypadContainer');
      container.innerHTML = `
        <button class="next-btn" onclick="nextRound()">... קדימה</button>
      `;
    } else {
      generateEquation();
      renderStaticKeypad();
      selectSlot(0, false);
    }
  }

  function nextRound() {
    playClickSound();
    revealedImagesCount++;
    startRound();
  }

  startRound();
</script>
</body>
</html>
