<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Math Image Reveal</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      width: 100vw;
      max-width: 768px;
      height: 100vh;
      max-height: 1024px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px;
      background-color: #ffffff;
      border: 2px solid #000000;
    }

    /* --- TOP SECTION --- */
    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 16px;
    }

    .image-container {
      position: relative;
      width: 320px;
      height: 320px;
      border: 4px solid #0288d1;
      background-color: #eee;
      overflow: hidden;
    }

    #gameImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      background-color: transparent;
      z-index: 2;
    }

    .tile {
      background-color: #81d4fa;
      border: 1px solid #0288d1;
      box-sizing: border-box;
      transition: opacity 0.4s ease;
    }

    .tile.revealed {
      opacity: 0;
      pointer-events: none;
    }

    .name-box {
      width: 260px;
      padding: 10px 0;
      border: 3px solid #2e7d32;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 4px;
      background-color: #ffffff;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .divider {
      width: 90%;
      height: 3px;
      background-color: #000000;
      margin: 4px 0;
    }

    /* --- MIDDLE SECTION --- */
    .middle-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      transition: opacity 0.2s ease;
    }

    .slot {
      width: 68px;
      height: 68px;
      border: 3px solid #0288d1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: bold;
      background-color: #ffffff;
      cursor: pointer;
    }

    .slot.active {
      background-color: #ffeb3b;
    }

    .target-equals {
      font-size: 2.4rem;
      font-weight: bold;
      margin-left: 8px;
    }

    /* --- BOTTOM SECTION --- */
    .bottom-section {
      width: 100%;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 12px;
    }

    .keypad {
      display: grid;
      gap: 12px;
      justify-content: center;
    }

    .keypad-digits {
      grid-template-columns: repeat(4, 72px);
    }

    .keypad-digits .key-btn:nth-child(9) {
      grid-column: 2;
    }

    .keypad-digits .key-btn:nth-child(10) {
      grid-column: 3;
    }

    .keypad-operators {
      grid-template-columns: repeat(2, 72px);
    }

    .key-btn {
      width: 72px;
      height: 64px;
      border: 3px solid #8d6e63;
      border-radius: 12px;
      background-color: #ffffff;
      font-size: 1.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #8d6e63;
      cursor: pointer;
    }

    .key-btn:active, .key-btn.selected {
      background-color: #ffeb3b;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #8d6e63;
    }

    .feedback-emoji {
      font-size: 6rem;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .next-btn {
      padding: 18px 36px;
      font-size: 1.6rem;
      font-weight: bold;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 0 #2e7d32;
      cursor: pointer;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2e7d32;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- TOP SECTION -->
  <div class="top-section">
    <div class="image-container" id="imageContainer">
      <img id="gameImage" src="" alt="Hidden Item" />
      <div class="grid-overlay" id="gridOverlay"></div>
    </div>
    <div class="name-box" id="itemName">---</div>
    <div class="divider"></div>
  </div>

  <!-- MIDDLE SECTION -->
  <div class="middle-section" id="middleSection">
    <div class="slot active" id="slot0" onclick="selectSlot(0)">?</div>
    <div class="slot" id="slot1" onclick="selectSlot(1)">?</div>
    <div class="slot" id="slot2" onclick="selectSlot(2)">?</div>
    <div class="target-equals" id="targetDisplay">= ?</div>
  </div>

  <!-- BOTTOM SECTION -->
  <div class="bottom-section" id="keypadContainer"></div>
</div>

<script>
  const itemBank = [
    { name: "סבתא וסבא",    image: "./imagesimages_game_001/image_001.jpg" },
    { name: "CAMERA",   image: "https://picsum.photos/id/250/400/400" },
    { name: "MOUNTAIN", image: "https://picsum.photos/id/29/400/400" }
  ];

  let currentItemIndex = 0;
  let hiddenTiles = [];
  let activeSlot = 0;
  const slotValues = [null, null, null];
  let targetValue = 0;
  let solvedEquationsCount = 0;
  let isProcessingAnswer = false;

  // Web Audio Synthesizer
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function ensureAudioContext() {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playClickSound() {
    ensureAudioContext();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);
  }

  function playSuccessSound() {
    ensureAudioContext();
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);       // C5
    osc.frequency.setValueAtTime(783.99, now + 0.12); // G5

    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.35);
  }

  function playErrorSound() {
    ensureAudioContext();
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(164.81, now);       // E3
    osc.frequency.setValueAtTime(123.47, now + 0.15); // B2

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.4);
  }

  function getGridDimensions(solvedCount) {
    if (solvedCount < 2) return 2;
    if (solvedCount < 7) return 3;
    if (solvedCount < 12) return 4;
    return 5;
  }

  function startRound() {
    const currentItem = itemBank[currentItemIndex];
    
    const imgElement = document.getElementById('gameImage');
    imgElement.src = currentItem.image;

    document.getElementById('itemName').textContent = "---";

    const gridSize = getGridDimensions(solvedEquationsCount);
    const totalTiles = gridSize * gridSize;

    const gridOverlay = document.getElementById('gridOverlay');
    gridOverlay.innerHTML = '';
    gridOverlay.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    gridOverlay.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

    hiddenTiles = Array.from({ length: totalTiles }, (_, index) => index);

    for (let i = 0; i < totalTiles; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${i}`;
      gridOverlay.appendChild(tile);
    }

    generateEquation();
    selectSlot(0, false);
  }

  function generateEquation() {
    const roll = Math.random();
    let n1, op, n2, target;

    n1 = Math.floor(Math.random() * 10);
    n2 = Math.floor(Math.random() * 10);

    if (roll < 0.10) {
      op = '÷';
      n2 = Math.floor(Math.random() * 8) + 1;
      target = Math.floor(Math.random() * 9) + 1;
      n1 = target * n2;
      
      if (n1 > 9) {
        n1 = Math.floor(Math.random() * 8) + 2;
        n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
        while (n1 % n2 !== 0) {
          n2--;
        }
        target = n1 / n2;
      }
    } else if (roll < 0.30) {
      op = '×';
      target = n1 * n2;
    } else if (roll < 0.65) {
      op = '-';
      if (n1 < n2) [n1, n2] = [n2, n1];
      target = n1 - n2;
    } else {
      op = '+';
      target = n1 + n2;
    }

    targetValue = target;

    document.getElementById('targetDisplay').textContent = `= ${targetValue}`;
    
    slotValues[0] = null;
    slotValues[1] = null;
    slotValues[2] = null;

    document.getElementById('slot0').textContent = '?';
    document.getElementById('slot1').textContent = '?';
    document.getElementById('slot2').textContent = '?';
  }

  function selectSlot(index, playSound = true) {
    if (isProcessingAnswer) return;
    if (playSound) playClickSound();

    activeSlot = index;
    document.querySelectorAll('.slot').forEach((s, idx) => {
      s.classList.toggle('active', idx === activeSlot);
    });
    renderKeypad();
  }

  function renderKeypad() {
    if (isProcessingAnswer) return;
    const container = document.getElementById('keypadContainer');
    container.innerHTML = '';

    if (activeSlot === 0 || activeSlot === 2) {
      const keypad = document.createElement('div');
      keypad.className = 'keypad keypad-digits';
      const digits = ['1','2','3','4','5','6','7','8','9','0'];
      
      digits.forEach(val => {
        const btn = document.createElement('div');
        btn.className = 'key-btn';
        if (slotValues[activeSlot] === val) btn.classList.add('selected');
        btn.textContent = val;
        btn.onclick = () => handleInput(val);
        keypad.appendChild(btn);
      });
      container.appendChild(keypad);
    } else if (activeSlot === 1) {
      const keypad = document.createElement('div');
      keypad.className = 'keypad keypad-operators';
      const ops = ['+', '-', '×', '÷'];
      
      ops.forEach(val => {
        const btn = document.createElement('div');
        btn.className = 'key-btn';
        if (slotValues[activeSlot] === val) btn.classList.add('selected');
        btn.textContent = val;
        btn.onclick = () => handleInput(val);
        keypad.appendChild(btn);
      });
      container.appendChild(keypad);
    }
  }

  function handleInput(value) {
    if (isProcessingAnswer) return;
    playClickSound();

    slotValues[activeSlot] = value;
    document.getElementById(`slot${activeSlot}`).textContent = value;

    if (!slotValues.includes(null)) {
      checkSolution();
    } else {
      const nextEmptyIndex = slotValues.findIndex(val => val === null);
      if (nextEmptyIndex !== -1) {
        selectSlot(nextEmptyIndex, false);
      }
    }
  }

  function showFeedback(emoji) {
    const container = document.getElementById('keypadContainer');
    container.innerHTML = `<div class="feedback-emoji">${emoji}</div>`;
  }

  function checkSolution() {
    if (slotValues.includes(null) || isProcessingAnswer) return;

    isProcessingAnswer = true;
    const num1 = parseInt(slotValues[0]);
    const op = slotValues[1];
    const num2 = parseInt(slotValues[2]);
    let result = null;

    if (op === '+') result = num1 + num2;
    if (op === '-') result = num1 - num2;
    if (op === '×') result = num1 * num2;
    if (op === '÷') result = num2 !== 0 ? num1 / num2 : null;

    if (result === targetValue) {
      solvedEquationsCount++;
      playSuccessSound();
      showFeedback('😊');
      
      setTimeout(() => {
        isProcessingAnswer = false;
        revealRandomTile();
      }, 1500);
    } else {
      playErrorSound();
      showFeedback('😢');
      const middleSection = document.getElementById('middleSection');
      middleSection.style.opacity = '0.3';

      setTimeout(() => {
        middleSection.style.opacity = '1';
        slotValues[0] = null;
        slotValues[1] = null;
        slotValues[2] = null;

        document.getElementById('slot0').textContent = '?';
        document.getElementById('slot1').textContent = '?';
        document.getElementById('slot2').textContent = '?';

        isProcessingAnswer = false;
        selectSlot(0, false);
      }, 1500);
    }
  }

  function revealRandomTile() {
    if (hiddenTiles.length > 0) {
      const randomIndex = Math.floor(Math.random() * hiddenTiles.length);
      const tileToReveal = hiddenTiles.splice(randomIndex, 1)[0];
      document.getElementById(`tile-${tileToReveal}`).classList.add('revealed');
    }

    if (hiddenTiles.length === 0) {
      const currentItem = itemBank[currentItemIndex];
      document.getElementById('itemName').textContent = currentItem.name;

      const container = document.getElementById('keypadContainer');
      container.innerHTML = `
        <button class="next-btn" onclick="nextRound()">Next Puzzle</button>
      `;
    } else {
      generateEquation();
      selectSlot(0, false);
    }
  }

  function nextRound() {
    playClickSound();
    currentItemIndex = (currentItemIndex + 1) % itemBank.length;
    startRound();
  }

  // Initialize Game on Load
  startRound();
</script>
</body>
</html>
