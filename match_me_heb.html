// Start button logic
const startGame = () => {
  const startScreen = document.getElementById("start-screen");
  const gameScreen = document.getElementById("game-screen");

  // Do nothing if game screen already visible
  if (!startScreen.classList.contains("hidden")) {
    CURRENT_THEME = document.getElementById("theme-select").value;

    startScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");

    initGame();
  }
};

// Start on button click
document.getElementById("start-btn").addEventListener("click", startGame);

// Auto-start on dropdown change
//document.getElementById("theme-select").addEventListener("change", startGame);
document.getElementById("theme-select").addEventListener("change", () => {
  CURRENT_THEME = document.getElementById("theme-select").value;
  updateBestDisplay();
});

document.getElementById("play-again-btn").addEventListener("click", () => {
  document.getElementById("end-overlay").classList.add("hidden");
  initGame();
});

function updateBestDisplay() {
  const bestSpan = document.getElementById("best-score");
  if(bestSpan){
    const best = bestScores[CURRENT_THEME] ?? "-";
    bestSpan.textContent = `${best} :הכי טוב`;
  }
}

// Initialize game
function initGame() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  cards = [];
  flippedCards = [];
  lockBoard = false;
  tries = 0;
  updateTriesDisplay();

  let selected = THEMES[CURRENT_THEME].slice(0, (GRID_SIZE*GRID_SIZE)/2);
  let cardValues = [...selected, ...selected];
  shuffle(cardValues);

  cardValues.forEach((value,index) => {
    const card = createCard(value,index);
    board.appendChild(card);
    cards.push(card);
  });

  // Update best score display on start screen
  updateBestDisplay();
}

// Update tries display
function updateTriesDisplay() {
  const triesSpan = document.getElementById("tries-counter");
  if(triesSpan) triesSpan.textContent = `${tries} :נסיונות`;
}

function createCard(value, index) {
  const card = document.createElement("div");
  card.classList.add("card");
  card.dataset.value = value;
  card.dataset.index = index;

  const inner = document.createElement("div");
  inner.classList.add("card-inner");

  const front = document.createElement("div");
  front.classList.add("card-face", "card-front");

  const back = document.createElement("div");
  back.classList.add("card-face", "card-back");
  const img = document.createElement("img");
  img.src = value;
  img.style.width = "70%";
  img.style.height = "70%";
  img.style.objectFit = "contain";
  back.appendChild(img);

  inner.appendChild(front);
  inner.appendChild(back);
  card.appendChild(inner);

  card.addEventListener("click", () => handleCardClick(card));

  return card;
}

let audioUnlocked = false;

function handleCardClick(card) {
  if(lockBoard || card.classList.contains("flipped")) return;

  /*const flipSound = document.getElementById("flip-sound");

  playSound("flip-sound");
  card.classList.add("flipped");
  flippedCards.push(card);

  if(flippedCards.length === 2) checkMatch();
}

function playSound(sound_id) {
  const theSound = document.getElementById(sound_id);

  // Unlock audio on first click

    theSound.play().catch(()=>{}); // plays silently to unlock
    audioUnlocked = true;
  }

  theSound.currentTime = 0;
  theSound.play().catch(()=>{}); // play sound safely
}

// Check match & increment tries
function checkMatch() {
  lockBoard = true;
  tries++; // increment tries on every pair flip
  updateTriesDisplay();

  const [c1,c2] = flippedCards;
  if(c1.dataset.value === c2.dataset.value){
    c1.classList.add("pop"); c2.classList.add("pop");
    setTimeout(() => {
      c1.classList.add("disabled"); c2.classList.add("disabled");
      c1.classList.remove("pop"); c2.classList.remove("pop");
      resetTurn(); checkWin();
      //playSound("match-sound");
    }, 300);
  } else {
    setTimeout(() => { c1.classList.remove("flipped"); c2.classList.remove("flipped"); resetTurn(); }, MISMATCH_DELAY);
  }
}


function resetTurn() {
  flippedCards = [];
  lockBoard = false;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// Update best score on win
function checkWin(){
  if(cards.every(c=>c.classList.contains("disabled"))){

    // Update best score
    if(!bestScores[CURRENT_THEME] || tries < bestScores[CURRENT_THEME]){
      bestScores[CURRENT_THEME] = tries;

      // Save to localStorage
      localStorage.setItem("memoryBestScores", JSON.stringify(bestScores));
    }

    const overlay = document.getElementById("end-overlay");
    const message = document.getElementById("end-message");

    //message.textContent = `🎉 You won in ${tries} tries!`;
    message.textContent = `${tries} ניצחת 🎉 עם מס' נסיונות`;
    overlay.classList.remove("hidden");

    updateBestDisplay();
  }
}

updateBestDisplay();
